# =============================================================================
# pnpm Workspace Configuration
# =============================================================================

# ---------------------------------------------------------------------------
# Supply-chain security: require packages to be published for at least 1 day
# before allowing installation. Most malicious npm releases are discovered
# and pulled within hours, so this provides a strong safety buffer.
#
# Do NOT set this to 0 — it leaves the workspace vulnerable to supply-chain
# attacks. If you need to install a package before the window has passed,
# add it to `minimumReleaseAgeExclude` temporarily.
# ---------------------------------------------------------------------------
minimumReleaseAge: 1440

minimumReleaseAgeExclude: []

# ---------------------------------------------------------------------------
# Workspace packages
# ---------------------------------------------------------------------------
packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

# ---------------------------------------------------------------------------
# Shared dependency versions (catalog)
#
# Use `catalog:` in package.json to reference these pinned versions.
# This keeps dependency versions consistent across the monorepo.
# ---------------------------------------------------------------------------
catalog:
  "@tailwindcss/vite": ^4.1.14
  "@tanstack/react-query": ^5.90.21
  "@types/node": ^25.3.3
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # drizzle-kit uses an older esbuild internally; pin to our workspace version
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
